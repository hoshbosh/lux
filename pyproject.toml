[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "serve-bench"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "transformers>=4.40",
]

[project.scripts]
serve-bench = "serve_bench.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
